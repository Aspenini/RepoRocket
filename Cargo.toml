[package]
name = "reporocket"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0"
open = "5.3"
reqwest = { version = "0.11", features = ["blocking", "json"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
slint = "1.16.1"
steamgriddb_api = { version = "0.3.1", default-features = false, features = ["blocking"] }
urlencoding = "2.1"
walkdir = "2.5"
zip = "2.2"

[build-dependencies]
slint-build = "1.16.1"
