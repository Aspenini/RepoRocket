name: Build and Upload RepoRocket Artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Package Windows build
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/reporocket.exe dist/RepoRocket.exe
          if (Test-Path img) { Copy-Item img dist/img -Recurse }
          Compress-Archive -Path dist/* -DestinationPath RepoRocket-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoRocket-Windows
          path: RepoRocket-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zip libgtk-3-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev

      - name: Build release
        run: cargo build --release --locked

      - name: Package Linux build
        run: |
          mkdir -p dist
          cp target/release/reporocket dist/RepoRocket
          if [ -d img ]; then cp -r img dist/img; fi
          cd dist
          zip -r ../RepoRocket-Linux.zip *

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoRocket-Linux
          path: RepoRocket-Linux.zip
